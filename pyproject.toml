[project]
name = "onemoreepoch"
version = "0.1.0"
description = "A minimal deep learning library built from scratch"
readme = "README.md"
authors = [
    { name = "Akash Bisht", email = "akashbisht2021@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.1",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]
