name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: auto
          # Explicit interpreter, not --find-interpreter: runners also ship
          # newer Pythons (3.13/3.14) that PyO3 0.22 doesn't support yet,
          # and --find-interpreter would try (and fail) to build for those too.
          args: --release --out dist -i 3.12
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: dist

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          # Explicit interpreter, not --find-interpreter: runners also ship
          # newer Pythons (3.13/3.14) that PyO3 0.22 doesn't support yet,
          # and --find-interpreter would try (and fail) to build for those too.
          args: --release --out dist -i 3.12
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: dist

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Build wheels (universal2: Intel + Apple Silicon in one wheel)"
        uses: PyO3/maturin-action@v1
        with:
          target: universal2-apple-darwin
          # Explicit interpreter, not --find-interpreter: runners also ship
          # newer Pythons (3.13/3.14) that PyO3 0.22 doesn't support yet,
          # and --find-interpreter would try (and fail) to build for those too.
          args: --release --out dist -i 3.12
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [linux, windows, macos, sdist]
    # Manual runs default to TestPyPI (safe to re-run); publishing a GitHub
    # Release always goes to real PyPI.
    environment: ${{ (github.event_name == 'release' || inputs.target == 'pypi') && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write  # Trusted Publishing — no stored API token needed.
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist

      - name: Publish to PyPI
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
